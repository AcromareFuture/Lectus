include /etc/nginx/lectusglobal.http.conf;
server {
    listen 443 ssl http2;
    server_name www.lectusglobal.space;
    ssl_certificate /etc/letsencrypt/live/lectusglobal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lectusglobal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/lectus-saas/current/web;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location = /merchant { return 301 /merchant/; }
    location = /platform { return 301 /platform/; }
    location /merchant/ { try_files $uri $uri/ /merchant/index.html; }
    location /platform/ { try_files $uri $uri/ /platform/index.html; }
    location ~* \.(?:js|css|png|webp|jpg|jpeg|svg|ico|woff2|glb)$ {
        try_files $uri =404;
        expires 1h;
    }
    location = /api/community/media {
        client_max_body_size 52m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 3s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
    }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /merchant/index.html { add_header Cache-Control "no-store"; }
    location = /platform/index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
