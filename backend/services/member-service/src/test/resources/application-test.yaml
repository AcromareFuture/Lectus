spring:
  datasource:
    url: jdbc:h2:mem:viridac_tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:trade-test-schema.sql,classpath:community-test-schema.sql
viridac:
  trade:
    order-timeout-task-enabled: false

  aftersales:
    worker-enabled: false

spring.flyway.enabled: false
